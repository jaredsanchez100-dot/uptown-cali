<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO: this is what shows up in Google and in link previews. -->
  <title>Uptown Cali — Official Store</title>
  <meta name="description" content="Uptown Cali — Northern California streetwear. Heavyweight tees, fleece, headwear and accessories. Bay Area born, Uptown raised. Built Different." />
  <meta name="theme-color" content="#0b0b0b" />
  <meta property="og:title" content="Uptown Cali — Official Store" />
  <meta property="og:description" content="Northern California streetwear. Heavyweight tees, fleece and headwear. Built Different." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.uptowncali.com/" />
  <link rel="canonical" href="https://www.uptowncali.com/" />
  <!-- The crest on brand black. This is the picture that shows when someone
       drops the link in a text, a DM, or a post. -->
  <meta property="og:image" content="https://www.uptowncali.com/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Uptown Cali — Official Store" />
  <meta name="twitter:description" content="Northern California streetwear. Heavyweight tees, fleece and headwear. Built Different." />
  <meta name="twitter:image" content="https://www.uptowncali.com/images/og-image.jpg" />
  <!-- Browser tab icon, and the icon iOS uses when the site is saved to a
       home screen. The 32px one is a tighter crop — the full crest's outer
       lettering turns to mush at that size. -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <!-- Display + script faces. These carry the brand; if you change them here,
       update --font-display / --font-script at the top of styles.css to match. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Yesteryear&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- ============ NAV ============ -->
  <header class="nav">
    <div class="nav__inner">
      <a href="#/" class="brand" data-brand-name>BRAND</a>
      <nav class="nav__links" aria-label="Main">
        <a href="#shop">Shop</a>
        <a href="#lookbook" data-lookbook-link>Lookbook</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="cart-btn" id="cartBtn" aria-label="Open cart">
        <span aria-hidden="true">Cart</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ============ STOREFRONT (hidden when viewing a product) ============ -->
    <div id="storeView">
      <!-- Hero -->
      <section class="hero">
        <div class="hero__bg" aria-hidden="true"></div>
        <div class="hero__content">
          <p class="hero__kicker" data-tagline></p>
          <h1 class="hero__title" data-hero-headline></h1>
          <p class="hero__sub" data-hero-sub></p>
          <a href="#shop" class="btn btn--primary" data-hero-cta></a>
        </div>
      </section>

      <!-- Shop -->
      <section class="section" id="shop">
        <div class="section__head">
          <h2 class="section__title">Shop</h2>
          <p class="section__lead" data-shipping-note></p>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
        <div class="grid" id="productGrid"></div>
      </section>

      <!-- Lookbook -->
      <section class="section section--alt" id="lookbook">
        <div class="section__head">
          <h2 class="section__title">Lookbook</h2>
        </div>
        <div class="lookbook" id="lookbookGrid"></div>
      </section>

      <!-- About -->
      <section class="section" id="about">
        <div class="about">
          <div class="about__text">
            <h2 class="section__title" data-story-heading></h2>
            <div data-story></div>
            <div class="stats" id="stats"></div>
          </div>
          <div class="about__art" aria-hidden="true"></div>
        </div>
      </section>

      <!-- Contact / newsletter -->
      <section class="section section--alt" id="contact">
        <div class="contact">
          <h2 class="section__title">Stay Posted</h2>
          <p class="section__lead">Drop your email for first look at new releases.</p>
          <form class="newsletter" id="newsletterForm">
            <label class="sr-only" for="email">Email address</label>
            <input type="email" id="email" placeholder="you@email.com" required />
            <button type="submit" class="btn btn--primary">Sign Up</button>
          </form>
          <p class="form-msg" id="formMsg" role="status"></p>
          <div class="socials" id="socials"></div>
          <p class="contact__script">We don't follow trends,<br /><span>we set them.</span></p>
        </div>
      </section>
    </div>

    <!-- ============ PRODUCT DETAIL (shown at #/product/<id>) ============ -->
    <div id="productView" hidden></div>
  </main>

  <footer class="footer">
    <p class="footer__motto">Built Different. Repped Forever.</p>
    <p>&copy; <span id="year"></span> <span data-brand-name></span>. All rights reserved. Northern California.</p>
    <p class="footer__fine" id="footerNote"></p>
  </footer>

  <!-- ============ CART DRAWER ============ -->
  <div class="drawer" id="cartDrawer" hidden>
    <div class="drawer__scrim" id="cartScrim"></div>
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Shopping cart">
      <div class="drawer__head">
        <h2>Your Cart</h2>
        <button class="icon-btn" id="cartClose" aria-label="Close cart">&#10005;</button>
      </div>
      <div class="drawer__body" id="cartItems"></div>
      <div class="drawer__foot">
        <div class="drawer__total"><span>Subtotal</span><span id="cartTotal"></span></div>
        <p class="drawer__note" id="cartNote"></p>
        <button class="btn btn--primary btn--block" id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lightbox__close" id="lightboxClose" aria-label="Close">&#10005;</button>
    <div class="lightbox__inner" id="lightboxInner"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
